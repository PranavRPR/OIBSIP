<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F1F5F9; color: #0F172A; min-height: 100vh; }
        nav { background: #0F172A; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 20px; color: #38BDF8; }
        .btn-logout { background: #EF4444; color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .btn-logout:hover { background: #DC2626; }
        .dashboard { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { font-size: 18px; color: #0F172A; margin-bottom: 20px; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; color: #64748B; font-size: 13px; text-transform: uppercase; }
        td { padding: 12px 10px; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #E2E8F0; border-radius: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: #6366F1; }
        .btn-primary { background: #6366F1; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
        .btn-primary:hover { background: #4F46E5; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .bg-issued { background: #FEF3C7; color: #92400E; }
        .bg-returned { background: #D1FAE5; color: #065F46; }
        .col-span-2 { grid-column: span 2; }
    </style>
</head>
<body>
    <nav>
        <h1>Library Admin</h1>
        <a href="/logout" class="btn-logout">Logout</a>
    </nav>

    <div class="dashboard">
        <div class="card">
            <h2>Book Inventory</h2>
            <table>
                <thead><tr><th>Title</th><th>Author</th><th>Total Qty</th><th>Available</th></tr></thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.title}" style="font-weight: 600;"></td>
                        <td th:text="${book.author}" style="color: #64748B;"></td>
                        <td th:text="${book.quantity}"></td>
                        <td th:text="${book.available}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Add New Book</h2>
            <form th:action="@{/admin/addBook}" method="post">
                <div class="form-group"><input type="text" name="title" placeholder="Book Title" required></div>
                <div class="form-group"><input type="text" name="author" placeholder="Author Name" required></div>
                <div class="form-group"><input type="text" name="category" placeholder="Category" required></div>
                <div class="form-group"><input type="number" name="quantity" placeholder="Quantity" required></div>
                <button type="submit" class="btn-primary">Add Book</button>
            </form>
        </div>
        
        <div class="card col-span-2">
            <h2>All Issued Books Log</h2>
            <table>
                <thead><tr><th>User</th><th>Book Title</th><th>Status</th><th>Fine</th></tr></thead>
                <tbody>
                    <tr th:each="issue : ${issues}">
                        <td th:text="${issue.username}" style="font-weight: 600;"></td>
                        <td th:text="${issue.title}"></td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${issue.status == 'ISSUED'} ? 'bg-issued' : 'bg-returned'"
                                  th:text="${issue.status}"></span>
                        </td>
                        <td th:text="'$' + ${issue.fine}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
