<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center text-slate-800">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
        <h1 class="text-2xl font-bold mb-6 text-center text-indigo-600">Digital Library</h1>
        
        <div th:if="${param.error}" class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">
            Invalid credentials.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" name="username" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded transition">Sign In</button>
        </form>
        
        <div class="mt-4 text-xs text-slate-500 text-center">
            Test Admin: admin / admin123<br>
            Test User: student / student123
        </div>
    </div>
</body>
</html>
